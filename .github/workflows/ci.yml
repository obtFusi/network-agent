name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'  # Nightly at 03:00 UTC (integration tests)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt
      # Install runtime deps (with hashes) then dev deps (without hashes) separately
      - run: pip install -r requirements.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff format --check .
      - run: ruff check agent/ tools/ cli.py
      # Bidi/Unicode Trojaner Check (CVE-2021-42574)
      # Scannt: Python, YAML, Markdown, Dockerfile (Workflow-Manipulation!)
      - name: Check for hidden Unicode characters
        run: |
          if grep -rP '[\x{200B}-\x{200F}\x{202A}-\x{202E}\x{2066}-\x{2069}]' \
            --include='*.py' --include='*.yml' --include='*.yaml' \
            --include='*.md' --include='Dockerfile*' .; then
            echo "::error::Hidden Unicode/Bidi characters found!"
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest --cov=agent --cov=tools --cov-report=term-missing

  security:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Full history needed for gitleaks diff scan
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pip-audit bandit cyclonedx-bom
      # Dependency vulnerability audit
      - run: pip-audit -r requirements.txt
      # SAST: Python security linting (fail on High/Critical)
      - name: Run bandit SAST scan
        run: bandit -r tools/ agent/ cli.py -f json -o bandit-report.json -ll || true
      - name: Check bandit results
        run: |
          if python -c "import json; r=json.load(open('bandit-report.json')); exit(1 if any(i['issue_severity'] in ('HIGH','MEDIUM') and i['issue_confidence']=='HIGH' for i in r.get('results',[])) else 0)"; then
            echo "bandit: no high-confidence issues found"
          else
            echo "::error::bandit found high-confidence security issues"
            cat bandit-report.json | python -m json.tool
            exit 1
          fi
      # Secret scanning
      - name: Run gitleaks secret scan
        run: |
          GITLEAKS_VERSION="8.24.3"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --report-format json --report-path gitleaks-report.json --no-banner
          echo "gitleaks: no secrets found"
      # SBOM generation (CycloneDX)
      - name: Generate SBOM
        run: |
          pip install -r requirements.txt
          cyclonedx-py environment -o sbom.json --output-format json
      - name: Upload SBOM
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    steps:
      - uses: actions/checkout@v6
      - run: docker build -t network-agent:ci .
      # Smoke-Test: Container startet und --version funktioniert
      # Verifiziert: cli.py:78-79 (--version Flag), Dockerfile:17 (CMD)
      - run: docker run --rm network-agent:ci python cli.py --version
      # Container Security Scan (gepinnt auf Release-Tag!)
      # ignore-unfixed: true -> Base-Image CVEs ohne Fix blockieren CI nicht
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'network-agent:ci'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

  # Integration tests against Docker Compose pentest lab
  # Runs nightly and can be triggered manually - NOT required for PRs
  integration:
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements.txt
      - run: pip install -r requirements-dev.txt
      - name: Start pentest lab
        run: docker compose -f docker-compose.pentest-lab.yml up -d --wait --timeout 120
      - name: Run integration tests
        run: pytest tests/integration/ -v --timeout=60
      - name: Stop pentest lab
        if: always()
        run: docker compose -f docker-compose.pentest-lab.yml down -v
