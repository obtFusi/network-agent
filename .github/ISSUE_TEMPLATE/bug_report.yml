name: Bug Report
description: Report a bug
labels: ["type:bug", "status:backlog", "priority:high"]
body:
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Numbered steps, deterministic, no ambiguity
      value: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: What version are you using? (run `python cli.py --version`)
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Docker version, how you started the agent
      value: |
        - OS: [e.g. Windows 11, Ubuntu 24.04]
        - Docker Version: [e.g. 27.0.0]
        - Started via: [PowerShell / WSL2 / Linux / Docker]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: Any error messages or screenshots (optional)
