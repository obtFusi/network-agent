name: Feature Request
description: Suggest a new feature
labels: ["type:feature", "status:backlog"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe your proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other solutions did you consider? (optional)
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context or screenshots (optional)
